name: Task Submission
description: Submit a Harbor task from your repository's CI
labels: ["task-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ This form is auto-filled by the Harbor Task Checker
        
        If you're here manually, please use the **"Submit to Task Bank"** button 
        in your CI workflow's Job Summary instead.
        
        The button appears after your PR passes the Harbor Task Check.
        
        ---

  - type: textarea
    id: submission-details
    attributes:
      label: Submission Details
      description: |
        This section is auto-populated by the Harbor Task Checker.
        Do not modify the table - it's used to automatically import your task.
      placeholder: |
        ## Task Submission
        
        | Field | Value |
        |-------|-------|
        | **Task ID** | `repo__name-123` |
        | **Source Repo** | [owner/repo](https://github.com/owner/repo) |
        | **Source PR** | [#123](https://github.com/owner/repo/pull/123) |
        | **Artifact** | [Download from CI](https://github.com/...) |
        | **Run ID** | `123456789` |
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please confirm the following
      options:
        - label: I am a contributor to the source repository
          required: true
        - label: I understand this task may be used for AI training and evaluation
          required: true

